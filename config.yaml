# Описание add-on'а для Home Assistant.
# Supervisor читает этот файл: имя, права, порты, настройки.
name: "PlantControl (dev)"
# Версия определяет и тег готового образа. В dev здесь следующий релиз с суффиксом
# -dev (сборки получат -dev.N), в beta - -beta.N, в main - без суффикса.
version: "0.2.0-dev.38"
slug: plant_control
description: "Targeted plant watering: your own watering machines, schedules, queue and problems"
url: https://github.com/Mkilord/plant-control
# Готовый образ собирает GitHub Actions (.github/workflows/builder.yaml).
# Для локальной сборки на машине с HA строку нужно закомментировать.
image: ghcr.io/mkilord/plant-control-{arch}
arch:
  - amd64
  - aarch64
init: false
# Интерфейс открывается внутри Home Assistant, отдельный порт наружу не нужен.
ingress: true
ingress_port: 8099
panel_icon: mdi:watering-can
panel_title: PlantControl
# Доступ к API Home Assistant: включать реле насосов и клапанов.
homeassistant_api: true
hassio_api: true
# Брокер MQTT, если он есть: из него Home Assistant получает сущности машин.
services:
  - mqtt:want
# База машин лежит в /data: эту папку Supervisor сохраняет между обновлениями.
options:
  log_level: info
# Часовой пояс необязателен: без него берётся пояс Home Assistant.
schema:
  log_level: list(debug|info|warning|error)
  timezone: str?
