[project]
name = "plant-control"
version = "0.1.0"
description = "Ядро адресного полива растений для Home Assistant"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    # Часовые пояса расписаний. В Linux база берётся из системы,
    # в Windows её нет вовсе, поэтому пакет ставится там.
    "tzdata; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plant_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
