[project]
name = "plant-control-addon"
version = "0.1.0"
description = "Add-on Home Assistant для адресного полива: REST API, адаптер HA, хранилище"
requires-python = ">=3.13"
dependencies = [
    "plant-control",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiohttp>=3.10",
    "pydantic-settings>=2.4",
    "aiomqtt>=2.3",
    "tzdata; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "mypy",
    "ruff",
]

[tool.uv.sources]
# Ядро лежит в корне репозитория и подключается как локальная зависимость.
plant-control = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plant_control_addon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
