name: CI

on:
  push:
    branches: [dev, beta, main]
  pull_request:

permissions:
  contents: read

jobs:
  addon-config:
    name: Add-on config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse YAML files
        run: |
          python3 - <<'EOF'
          import sys, yaml
          files = ["config.yaml", "repository.yaml", "translations/en.yaml", "translations/ru.yaml"]
          for name in files:
              with open(name, encoding="utf-8") as f:
                  yaml.safe_load(f)
              print("ok", name)
          EOF

  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy src tests experiments
      - run: uv run pytest

  backend:
    name: Add-on backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon/backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest

  frontend:
    name: Add-on frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: addon/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            BUILD_VERSION=ci
            BUILD_ARCH=amd64
